# Déclenche l'ingestion des actualités toutes les heures en appelant l'application déployée.
# Gratuit (GitHub Actions). Ne fait rien tant que les secrets MARVELHQ_URL et CRON_SECRET
# ne sont pas définis dans Settings → Secrets and variables → Actions.
name: Ingestion des actualités
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/cron/ingest
        env:
          URL: ${{ secrets.MARVELHQ_URL }}
          TOKEN: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "Secrets non configurés : étape ignorée."
            exit 0
          fi
          curl --fail-with-body -sS -m 90 -H "Authorization: Bearer $TOKEN" "$URL/api/cron/ingest"
